# RAS University synthetic generator configuration.
# All generator behavior must read these values — none may be hard-coded
# in source. Effect sizes marked "tunable" are engineering parameters to be
# calibrated during Phase 4; documented targets (rates, scale) must match
# docs/prd.md and docs/memory.md.

# ── Seed ───────────────────────────────────────────────
# Same seed + same config => reproducible dataset (rules.md §8.2).
[generator]
seed = 42

# ── Target population & generation scale ───────────────
# Engineering targets (docs/prd.md §7), not measured results.
[scale]
target_students = 12000
target_courses = 250              # full target; initial catalog in config/university/courses.toml is smaller
courses_per_student_per_semester = 6
elective_courses_per_semester = 3   # drawn from outside the student's school; the rest are in-school courses
target_lms_events = 70000000
lms_events_per_student_per_day = 15   # documented assumption (~15/day)
teaching_days_per_academic_year = 200

# Student population split across the six schools; must sum to target_students.
[scale.school_population]
cet = 2600
set = 3000
som = 2400
lad = 2200
sci = 1000
sol = 800

# ── Student behavioral traits (docs/prd.md §13.1) ──────
# Latent traits in [0, 1]; attendance, marks, LMS activity and submission
# timing are drawn from these with noise and course-difficulty effects.
[behavior.student_traits]
ability = { mean = 0.65, std = 0.15 }
diligence = { mean = 0.60, std = 0.18 }
engagement = { mean = 0.55, std = 0.20 }
observation_noise_std = 0.10   # tunable: controlled noise added to latent traits
# Influence weights: outcome shifts per unit of trait above its mean
# (behavioral model, task 4.7). All tunable engineering parameters.
ability_marks_weight = 24.0             # marks points per unit of ability (records)
diligence_attendance_weight = 0.13      # weekly attendance probability per unit of diligence
engagement_attendance_weight = 0.10     # weekly attendance probability per unit of engagement
diligence_late_weight = 0.4             # relative late-probability reduction per unit of diligence

# ── Decliner population (docs/memory.md §6: ~8%) ───────
# Engagement fades during the semester; marks drop a few weeks later.
# Decliner status is hidden generator state (frozen students schema).
[behavior.decliners]
rate = 0.08
start_week = 5                  # tunable: approximate decline start week
weekly_engagement_decay = 0.07  # tunable: fraction of engagement lost per week
marks_decline_lag_weeks = 3     # tunable: marks follow engagement decline
component_weeks = { internal = 4, midterm = 9, endterm = 15 }  # week each marks component is collected
marks_weekly_decline = 2.0      # tunable: marks points lost per week once marks decline starts
score_weekly_decay = 0.04       # tunable: fraction of coursework score quality lost per week

# ── Weekly & semester rhythms (original_idea §7.1) ─────
# Fewer weekend events, spikes before deadlines/exams, mid-semester dip.
[behavior.rhythms]
weekend_event_factor = 0.40          # tunable
mid_semester_dip_factor = 0.80       # tunable
pre_deadline_spike_factor = 1.60     # tunable
pre_exam_spike_factor = 1.80         # tunable

# ── Academic performance & grading (F-B04) ─────────────
# Each marks component (internal/midterm/endterm, 0–100) is drawn per
# student×course×semester around a record-level latent score: the
# baseline shifted by the course difficulty drag
# (difficulty × course_difficulty.max_score_drag points), plus
# per-component noise. Engineering parameters.
[behavior.academic_performance]
baseline_mean = 72.0   # tunable: expected latent score before difficulty drag
record_std = 10.0      # tunable: spread of record-level latent scores
component_std = 4.0    # tunable: noise added to each marks component

# Letter grade for the unweighted mean of the three marks components;
# below the lowest band boundary the grade is "F". Docs fix only that
# grades are letter strings (e.g. "A"), so boundaries are tunable.
[behavior.grade_scale]
A = 85
B = 75
C = 65
D = 50

# ── Weekly attendance (F-B05) ───────────────────────────
# Per student×course×week: classes_attended ~ Binomial(classes_conducted, p).
# p combines the base rate, the school profile attendance multiplier, the
# course difficulty drag (confounder, F-B09), alignment with the term
# aggregate marks (plants attendance↔marks, F-B09) and weekly noise.
# Engineering parameters; attendance percentage is never stored (rules.md §13).
[behavior.weekly_attendance]
classes_conducted = 4        # per course per week (matches the schema example)
base_probability = 0.85      # tunable: university-wide weekly attendance rate
alignment_weight = 0.20      # tunable: strength of the attendance↔marks coupling
weekly_noise_std = 0.08      # tunable: week-to-week probability noise
probability_floor = 0.05     # tunable: clip bounds after shifting
probability_ceiling = 0.98

# ── Coursework (F-B06) ──────────────────────────────────
# Items are defined per course-semester and shared by all enrolled students,
# so rows = enrollment × items (drives the documented ~3.5M coursework
# target). Quiz counts scale with the course's school quiz_activity profile;
# late timing scales with the student's school late_submission profile and
# aligns against term marks (plants late↔marks negative, F-B09). Scores
# align with term marks as well (score ↔ performance). Engineering
# parameters unless marked by a document.
[behavior.coursework]
assignments_per_course_per_semester = 8
quizzes_per_course_per_semester = 4     # before school quiz_activity scaling
assignment_window_days = 7              # due = assigned + window (example: 7 days)
quiz_window_days = 3
max_late_days = 7                       # LATE submissions land 1..max_late_days after due
missing_probability = 0.04              # tunable: P(not submitted)
late_probability = 0.14                 # tunable: baseline P(late | submitted)
late_marks_alignment = 0.9              # tunable: strength of the late↔marks (negative) coupling
quiz_retry_probability = 0.30           # tunable: P(each extra quiz attempt)
max_quiz_attempts = 3
assignment_max_score = 20               # matches the original idea example
quiz_max_score = 5
score_noise_std = 0.15                  # tunable: noise on score quality

# ── School behavior profiles ───────────────────────────
# Multipliers shift generated behavior per school (original_idea §5.2).
# Values near 1.0 = baseline; all tunable.
[school_profiles]
cet = { lms_activity = 1.40, attendance = 1.00, quiz_activity = 1.50, late_submission = 1.00 }  # very high LMS/quiz, coding-style assessments
set = { lms_activity = 0.90, attendance = 1.00, quiz_activity = 1.00, late_submission = 1.10 }  # assignment/lab heavy, moderate LMS
som = { lms_activity = 1.00, attendance = 1.15, quiz_activity = 0.80, late_submission = 1.10 }  # attendance-sensitive, case/assignment heavy
lad = { lms_activity = 1.00, attendance = 0.95, quiz_activity = 0.50, late_submission = 1.20 }  # reading/forum heavy, fewer quizzes, lumpy submissions
sci = { lms_activity = 1.00, attendance = 1.10, quiz_activity = 1.00, late_submission = 0.95 }  # steady, exam-weighted
sol = { lms_activity = 0.85, attendance = 1.05, quiz_activity = 0.60, late_submission = 1.00 }  # reading heavy, fewer quizzes

# ── Course difficulty (docs/memory.md §6, §7) ──────────
# Difficulty is a confounder that shifts marks/attendance together.
[course_difficulty]
easy_share = 0.30
medium_share = 0.45
hard_share = 0.25
max_score_drag = 12        # tunable: max marks penalty at hardest level (points)
attendance_drag = 0.08     # tunable: max attendance probability penalty at hardest level

# ── LMS event generation (F-B07) ───────────────────────────
# Event type distribution determines the probability of each approved
# event type. All event types must sum to 1.0. If not specified,
# a reasonable default distribution is used.
[lms_events.event_type_distribution]
LOGIN = 0.12
LOGOUT = 0.12
VIDEO_VIEW = 0.18
VIDEO_COMPLETE = 0.08
PDF_VIEW = 0.12
RESOURCE_DOWNLOAD = 0.10
QUIZ_ATTEMPT = 0.08
ASSIGNMENT_VIEW = 0.10
ASSIGNMENT_SUBMISSION = 0.06
COURSE_PAGE_VIEW = 0.03
FORUM_POST = 0.01

# ── Data-quality injection rates (docs/memory.md §12) ──
# Approximate rates; exact injected counts go to the injection manifest.
# Key identifiers must never be nulled (rules.md §10.1).
[data_quality_injection]
duplicate_lms_events = 0.01
nulls_non_key = 0.015            # midpoint of documented ~1–2%
timestamp_inconsistencies = 0.01
course_id_formatting = 0.005
orphan_records = 0.001
out_of_range_values = 0.001
null_key_fields_allowed = false
