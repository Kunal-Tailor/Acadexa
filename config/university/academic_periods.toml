# RAS University academic calendar — 2 academic years, 4 semesters.
# Dates are required by the generator for weekly attendance, coursework
# scheduling and LMS timestamp generation. All periods are closed (past)
# so batch analytics always run over complete semesters.
#
# Calendar convention: each semester is 16 teaching weeks, Monday–Sunday.

[academic_years]
AY1 = { label = "2024-25" }
AY2 = { label = "2025-26" }

[semesters]
S1 = { academic_year = "AY1", semester_index = 1, position_in_year = 1, term = "odd", start_date = 2024-07-15, end_date = 2024-11-03, teaching_weeks = 16 }
S2 = { academic_year = "AY1", semester_index = 2, position_in_year = 2, term = "even", start_date = 2025-01-06, end_date = 2025-04-27, teaching_weeks = 16 }
S3 = { academic_year = "AY2", semester_index = 3, position_in_year = 1, term = "odd", start_date = 2025-07-14, end_date = 2025-11-02, teaching_weeks = 16 }
S4 = { academic_year = "AY2", semester_index = 4, position_in_year = 2, term = "even", start_date = 2026-01-05, end_date = 2026-04-26, teaching_weeks = 16 }
